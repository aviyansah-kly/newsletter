name: Build PNG Newsletter IT Handover

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/png-handover.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rasterization dependencies
        run: python -m pip install 'cairosvg==2.8.2' 'Pillow==11.3.0'
      - name: Build and verify PNG-only handover
        run: python scripts/build-handover-png.py
      - name: Commit only packaged handover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handover/png-1.5x
          if ! git diff --cached --quiet; then
            git commit -m "Package 3 newsletter IT templates with PNG 1.5x assets"
            git push
          fi
