name: Import archive news photos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-news-photos.py'
      - '.github/workflows/import-news-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processor
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download, resize and verify image assets
        run: python scripts/fetch-news-photos.py
      - name: Commit locally hosted photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Store verified news-photo assets locally"
            git push origin HEAD:main
          fi
