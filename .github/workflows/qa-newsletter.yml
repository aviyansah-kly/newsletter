name: QA Newsletter Responsive

on:
  push:
    branches: [main]
    paths:
      - 'daily-email.html'
      - 'weekly.html'
      - 'weekly-email.html'
      - 'scripts/qa-weekly.cjs'
      - 'index.html'
      - 'daily-editorial.html'
      - 'daily-digest.html'
      - 'daily-alternatives.html'
      - 'scripts/qa-alternatives.cjs'
      - 'assets/**'
      - 'scripts/qa-newsletter.cjs'
      - '.github/workflows/qa-newsletter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Run desktop and mobile browser QA
        run: node scripts/qa-newsletter.cjs
      - name: Run Weekly desktop and mobile QA
        run: node scripts/qa-weekly.cjs
      - name: QA Daily alternative designs
        run: node scripts/qa-alternatives.cjs
      - name: Upload alternative preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-alternatives-qa
          path: qa-alternatives-screenshots/
          retention-days: 10
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-qa-screenshots
          path: qa-screenshots/
          retention-days: 10
      - name: Upload Weekly visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-newsletter-qa-screenshots
          path: qa-weekly-screenshots/
          retention-days: 10
